<text x="561" y="816" font-size="23" fill="#B45309" font-weight="700" text-anchor="start">If the fitted-model bytes are lost…</text>
<text x="561" y="848" font-size="18" fill="#B45309" font-weight="400" text-anchor="start">URI + source run can remain recorded</text>
<text x="1091" y="824" font-size="20" fill="#B45309" font-weight="600" text-anchor="start">original model load blocked</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">A fingerprint cannot rebuild a missing file.</title><desc id="desc">A recorded manifest links five ingredients: source archive/code revision, snapshot/data hash, exact configuration, Python/packages/lock environment and original model artifact/source run. The evaluation partition is recorded separately in manifest.json, not config.json. Each ingredient points to recoverable content. Missing fitted-model bytes block loading that original artifact; intact recipe ingredients may still allow retraining.</desc>
<defs>

<text x="720" y="990" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle">A name or hash can identify content. It cannot recreate content that was lost.</text>
<text x="64" y="1034" font-size="19" fill="#17482E" font-weight="600" text-anchor="start">Retain the fitted artifact and the training recipe. Each answers a different recovery question.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Carry the identity across every boundary.</title><desc id="desc">A schematic training execution R logs its fitted artifact, metrics and recipe. A registered version V retains source run R, active points to V, and a newly started batch records V and R. The learner draft index remains unclassified, without identifying its faulty link. A generic failed-validation branch stops at pending without moving the approved selection.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1080" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / CONNECTING THE SYSTEM</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Carry the identity across every boundary.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">An index points to evidence. It cannot make different model origins agree.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="239" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">ONE SOURCE EXECUTION / SCHEMATIC IDENTITIES R AND V</text>
<rect x="64" y="283" width="261" height="150" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="88" y="327" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start">Train + evaluate</text>
<text x="88" y="375" font-size="24" fill="#D7FF94" font-weight="400" text-anchor="start">fitted pipeline</text>
<text x="88" y="411" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">validation result</text>
<path d="M325 358 L419 358" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M433 283 L740 283 L764 307 L764 433 L433 433 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M740 283 L740 307 L764 307" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="457" y="327" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Tracked run R</text>
<text x="457" y="375" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">model URI + metrics</text>
<text x="457" y="411" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">recoverable recipe</text>
<path d="M764 358 L858 358" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M872 283 L1188 283 L1212 307 L1212 433 L872 433 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M1188 283 L1188 307 L1212 307" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="896" y="327" font-size="26" fill="#17482E" font-weight="700" text-anchor="start">Registered version V</text>
<text x="896" y="375" font-size="24" fill="#17482E" font-weight="700" text-anchor="start">source run R</text>
<text x="896" y="411" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">validation evidence tags</text>
<rect x="1248" y="316" width="128" height="66" rx="4" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="1312" y="360" font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="middle">active</text>
<path d="M1248 349 L1225 349" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M1042 433 L1042 507" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M872 521 L1352 521 L1376 545 L1376 646 L872 646 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M1352 521 L1352 545 L1376 545" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="896" y="564" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">New batch receipt</text>
<text x="896" y="609" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">resolved version V / source run R</text>
<path d="M64 521 L584 521 L608 545 L608 646 L64 646 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M584 521 L584 545 L608 545" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="88" y="564" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Your draft index: links to inspect</text>
<text x="88" y="609" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">run ID / model URI / version / job evidence</text>
<path d="M608 584 L850 584" fill="none" stroke="#17482E" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="730" y="554" font-size="20" fill="#27784C" font-weight="600" text-anchor="middle">reconcile</text>
<path d="M64 692 L1376 692" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="738" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">IF A SEPARATE CANDIDATE FAILS VALIDATION</text>
<path d="M64 777 L385 777 L409 801 L409 914 L64 914 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M385 777 L385 801 L409 801" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="87" y="819" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Pending candidate</text>
<text x="87" y="866" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">retained for diagnosis</text>
<path d="M409 843 L517 843" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="531" y="792" width="335" height="108" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="555" y="835" font-size="26" fill="#B91C1C" font-weight="700" text-anchor="start">Validation gate stops</text>
<text x="555" y="875" font-size="21" fill="#B91C1C" font-weight="400" text-anchor="start">no active reassignment</text>
<path d="M914 786 L914 910" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<text x="965" y="830" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Existing active selection</text>
<text x="965" y="875" font-size="25" fill="#27784C" font-weight="400" text-anchor="start">stays unchanged</text>
<text x="64" y="1034" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">Preserve raw records. Repair the evidence index or missing connection, using actual returned IDs.</text>
</g>
</svg>

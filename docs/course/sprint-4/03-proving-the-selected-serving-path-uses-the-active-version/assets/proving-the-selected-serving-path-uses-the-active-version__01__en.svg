<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Which model served these exact rows?</title><desc id="desc">A batch resolves active as version A once at job start. A later alias move to B does not rewrite that job receipt. Twenty-four ordered inputs pass the guard, the pinned model and output write. A whole-job bracket covers resolution through completed CSV, while setup/training stay outside. Input/output identifiers are preserved; invalid input stops before successful output.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1120" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / SERVING PROOF</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Which model served these exact rows?</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Read the job’s receipt, preserve the input identities, and time complete delivery.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="239" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">SETUP + TRAINING ALREADY COMPLETE / OUTSIDE THE JOB CLOCK</text>
<rect x="64" y="281" width="262" height="79" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="195" y="330" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">active = A</text>
<path d="M326 320 L417 320" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M431 281 L806 281 L830 305 L830 414 L431 414 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M806 281 L806 305 L830 305" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="455" y="325" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">Job resolves once</text>
<text x="455" y="376" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">version A / source run R</text>
<path d="M830 320 L914 320" fill="none" stroke="#17482E" stroke-width="2.5" stroke-dasharray="5 5"/>
<rect x="928" y="281" width="448" height="79" rx="5" fill="#FFFFFF" stroke="#17482E" stroke-width="1.5"/>
<text x="952" y="330" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">Later: active = B</text>
<text x="952" y="399" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">This job’s receipt still says A.</text>
<path d="M631 414 L631 455 L790 455 L790 644" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<text x="64" y="268" font-size="16" fill="#27784C" font-weight="600" text-anchor="start">start job clock</text>
<path d="M43 272 L30 272 L30 883 L43 883" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="64" y="506" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">ONE JOB / THE RESOLVED VERSION STAYS FIXED</text>
<path d="M64 645 L299 645 L323 669 L323 868 L64 868 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M299 645 L299 669 L323 669" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="88" y="689" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">24 input rows</text>
<text x="88" y="735" font-size="24" fill="#27784C" font-weight="600" text-anchor="start">B00</text>
<text x="88" y="778" font-size="24" fill="#27784C" font-weight="600" text-anchor="start">B01</text>
<text x="88" y="838" font-size="24" fill="#27784C" font-weight="600" text-anchor="start">B23</text>
<text x="200" y="804" font-size="26" fill="#27784C" font-weight="400" text-anchor="start">…</text>
<path d="M323 750 L403 750" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="417" y="692" width="193" height="113" rx="5" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="513" y="737" font-size="24" fill="#17482E" font-weight="700" text-anchor="middle">input guard</text>
<text x="513" y="776" font-size="19" fill="#27784C" font-weight="400" text-anchor="middle">valid rows</text>
<path d="M610 750 L668 750" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="682" y="658" width="216" height="184" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="790" y="704" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pinned model</text>
<text x="790" y="754" font-size="31" fill="#D7FF94" font-weight="700" text-anchor="middle">Version A</text>
<text x="790" y="799" font-size="20" fill="#FFFFFF" font-weight="400" text-anchor="middle">predict + write</text>
<path d="M898 750 L978 750" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M992 645 L1352 645 L1376 669 L1376 868 L992 868 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M1352 645 L1352 669 L1376 669" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="1016" y="689" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">24 output rows</text>
<text x="1016" y="735" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">B00</text>
<text x="1132" y="735" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">finite prediction</text>
<text x="1016" y="778" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">B01</text>
<text x="1132" y="778" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">finite prediction</text>
<text x="1016" y="838" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">B23</text>
<text x="1132" y="838" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">finite prediction</text>
<text x="1165" y="804" font-size="26" fill="#27784C" font-weight="400" text-anchor="start">…</text>
<path d="M513 805 L513 936 L672 936" fill="none" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow-red)"/>
<text x="699" y="925" font-size="26" fill="#B91C1C" font-weight="700" text-anchor="start">Invalid input stops here.</text>
<text x="699" y="962" font-size="21" fill="#B91C1C" font-weight="400" text-anchor="start">Keep its rejection separate from valid output.</text>
<text x="64" y="1017" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">Whole valid job: resolve + load + predict + write ≤ 60 s</text>
<text x="1016" y="902" font-size="17" fill="#27784C" font-weight="400" text-anchor="start">clock stops after the CSV is written</text>
<text x="64" y="1074" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">Schematic timing and A/B identities. The 60-second limit is supplied; measure your actual job.</text>
</g>
</svg>

<title id="title">Three clean boundaries. Three separate checks.</title><desc id="desc">Actual author receiving execution from restored source, new exact-patch locked environment and new tracking state with original store unavailable. Matched source/data/config/partition/environment are separated from absolute repeated validation RMSE difference and independent row/model/timing checks. This is not a classroom trial.</desc>

<text x="516" y="865" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">expected evidence + recovery</text>
<text x="516" y="921" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">+ extension explanation / proof</text>
<path d="M887 854 L976 854" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="64" y="731" width="325" height="245" rx="5" fill="#FFFFFF" stroke="#D0D0C4" stroke-width="1.5"/>
<text x="88" y="776" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Original store</text>
<text x="88" y="823" font-size="23" fill="#27784C" font-weight="400" text-anchor="start">preserved intact</text>
<text x="88" y="868" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">unavailable to receiver</text>
<path d="M209 906 L243 940" fill="none" stroke="#B45309" stroke-width="3"/>
<path d="M209 940 L243 906" fill="none" stroke="#B45309" stroke-width="3"/>
<text x="64" y="1055" font-size="24" fill="#17482E" font-weight="700" text-anchor="start">The export does not collect work/HANDOFF.md or arbitrary learner notes automatically.</text>
<text x="64" y="1134" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">A recorded model URI explains origin. The exported model files remove the receiving dependency on it.</text>
</g>

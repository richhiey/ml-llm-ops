<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
<title id="title">Carry the recipe, not the old workspace.</title><desc id="desc">The original project exports a selected run into portable manifest/config/environment/source/model files, the actual selected training-data.csv and a checksum index after a release descriptor is checked. HANDOFF.md and explained-extension evidence are separate supplementary files beside the export. The receiver restores a new source folder, rebuilds an exact recorded Python/lock environment, and trains into a new store. The preserved original store is not consulted after export.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1180" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / PORTABLE HANDOFF</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Carry the recipe, not the old workspace.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">The receiver needs portable files, separate instructions, and three new places to work.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="239" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">1 / ORIGINAL PROJECT</text>
<path d="M64 279 L365 279 L389 303 L389 565 L64 565 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M365 279 L365 303 L389 303" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="88" y="322" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">Selected run</text>
<text x="88" y="369" font-size="23" fill="#27784C" font-weight="400" text-anchor="start">source + fitted artifact</text>
<text x="88" y="415" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">original tracking store</text>
<text x="88" y="461" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">validated release.json</text>
<text x="88" y="521" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">export while available</text>
<path d="M389 421 L476 421" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<text x="492" y="239" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">2 / CANONICAL EXPORT</text>
<path d="M492 279 L863 279 L887 303 L887 673 L492 673 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M863 279 L863 303 L887 303" fill="none" stroke="#17482E" stroke-width="2"/>

<title id="title">Find the first failed boundary.</title><desc id="desc">An unclassified Harbor candidate approaches ordered package integrity, recipe, repeated-evaluation and delivery gates. The first failing gate and file remain unknown. Below, a preserved canonical export and earlier clean proof connect to a comparison of indexed bytes and demonstrated conditions; evidence may be reused only when it still applies, otherwise a new clean receiving test is needed.</desc>

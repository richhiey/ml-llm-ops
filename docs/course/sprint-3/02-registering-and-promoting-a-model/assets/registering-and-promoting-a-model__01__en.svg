<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">One version. Three separate decisions.</title><desc id="desc">An actual selected reference run is registered as a pending version. A deliberate pending activation is rejected. The same version receives approval evidence before explicit active alias assignment. A newly executed batch resolves the same version and source run. Version/source identities persist throughout; only metadata and selection change.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1100" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / REGISTER, APPROVE, ACTIVATE</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">One version. Three separate decisions.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Register the selected artifact, record observed validation, then choose it for the next job.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">SELECTED FITTED ARTIFACT / NO NEW TRAINING</text>
<path d="M64 278 L378 278 L402 302 L402 437 L64 437 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M378 278 L378 302 L402 302" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="88" y="318" font-size="23" fill="#27784C" font-weight="600" text-anchor="start">Source run</text>
<text x="88" y="359" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">23e02c85cb04…</text>
<text x="88" y="402" font-size="21" fill="#17482E" font-weight="400" text-anchor="start">scaler + Ridge model</text>
<path d="M402 359 L497 359" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="529" cy="268" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="529" y="273" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">1</text>
<text x="554" y="275" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Register</text>
<path d="M514 309 L844 309 L868 333 L868 453 L514 453 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M844 309 L844 333 L868 333" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="536" y="346" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Version 1</text>
<text x="536" y="385" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">23e02c85cb04…</text>
<rect x="535" y="407" width="311" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="547" y="428" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">validation_status = pending</text>
<rect x="979" y="320" width="397" height="111" rx="5" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="1000" y="358" font-size="25" fill="#B91C1C" font-weight="700" text-anchor="start">Pending activation rejects</text>
<text x="1000" y="399" font-size="18" fill="#B91C1C" font-weight="400" text-anchor="start">Only approved versions may be active</text>
<path d="M868 381 L965 381" fill="none" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow-red)"/>
<path d="M691 453 L691 531" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="79" cy="543" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="548" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">2</text>
<text x="104" y="550" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Observe checks, then approve</text>
<text x="64" y="599" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">Contract probes + finite guarded</text>
<text x="64" y="637" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">validation RMSE ≤ 5 kWh + reason</text>
<path d="M433 604 L497 604" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M514 548 L844 548 L868 572 L868 692 L514 692 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M844 548 L844 572 L868 572" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="536" y="585" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Same Version 1</text>
<text x="536" y="624" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">23e02c85cb04…</text>
<rect x="535" y="646" width="311" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="547" y="667" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">validation_status = approved</text>
<text x="979" y="580" font-size="24" fill="#17482E" font-weight="700" text-anchor="start">Approval records rationale.</text>
<text x="979" y="621" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">It does not run the tests.</text>
<path d="M691 692 L691 753" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="79" cy="771" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="776" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">3</text>
<text x="104" y="778" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Assign active</text>
<rect x="64" y="812" width="264" height="68" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="196" y="857" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">active</text>
<path d="M328 846 L462 846 L462 670 L501 670" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<text x="744" y="748" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">next job</text>
<path d="M514 783 L844 783 L868 807 L868 928 L514 928 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M844 783 L844 807 L868 807" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="537" y="823" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">New batch receipt</text>
<text x="537" y="865" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">resolved_version = 1</text>
<text x="537" y="905" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">23e02c85cb04…</text>
<text x="979" y="818" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">Same source run.</text>
<text x="979" y="858" font-size="24" fill="#27784C" font-weight="400" text-anchor="start">Same registered artifact.</text>
<text x="979" y="900" font-size="24" fill="#27784C" font-weight="400" text-anchor="start">24 aligned predictions.</text>
<text x="64" y="1003" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">Reference source run: 23e02c85cb044b928200d8d66459bedb</text>
<text x="64" y="1054" font-size="19" fill="#17482E" font-weight="600" text-anchor="start">The receipt proves what this job loaded. A later alias lookup cannot rewrite that earlier evidence.</text>
</g>
</svg>

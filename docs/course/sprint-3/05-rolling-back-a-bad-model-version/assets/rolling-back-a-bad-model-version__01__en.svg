<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Move the pointer. Preserve the models.</title><desc id="desc">Before and after views retain the same previous and trial version artifacts. Active moves from the trial to a qualifying prior version selected by the learner. An older batch receipt retains trial identity while a newly started batch resolves the restored selection. A retained application event records old/new/source/time/reason.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1080" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / ROLLBACK AND AUDIT</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Move the pointer. Preserve the models.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">A rollback changes the next job’s selection; it does not erase training or old outputs.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">BEFORE / TRIAL SELECTED</text>
<text x="798" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">AFTER / SUITABLE PRIOR VERSION SELECTED</text>
<path d="M64 281 L413 281 L437 305 L437 425 L64 425 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M413 281 L413 305 L437 305" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="86" y="318" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Prior version</text>
<text x="86" y="357" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">source run / fitted artifact</text>
<rect x="85" y="379" width="330" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="97" y="400" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">approval + revised requirement</text>
<path d="M64 491 L413 491 L437 515 L437 635 L64 635 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M413 491 L413 515 L437 515" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="86" y="528" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Trial version</text>
<text x="86" y="567" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">source run / fitted artifact</text>
<rect x="85" y="589" width="330" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="97" y="610" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">retain incident evidence</text>
<path d="M798 281 L1147 281 L1171 305 L1171 425 L798 425 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M1147 281 L1147 305 L1171 305" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="820" y="318" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Prior version</text>
<text x="820" y="357" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">source run / fitted artifact</text>
<rect x="819" y="379" width="330" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="831" y="400" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">approval + revised requirement</text>
<path d="M798 491 L1147 491 L1171 515 L1171 635 L798 635 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M1147 491 L1147 515 L1171 515" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="820" y="528" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Trial version</text>
<text x="820" y="567" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">source run / fitted artifact</text>
<rect x="819" y="589" width="330" height="29" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="831" y="610" font-size="16" fill="#17482E" font-weight="600" text-anchor="start">retain incident evidence</text>
<rect x="482" y="526" width="191" height="64" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="577" y="569" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">active</text>
<path d="M482 558 L450 558" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="1216" y="316" width="160" height="64" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="1296" y="359" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">active</text>
<path d="M1216 348 L1184 348" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M699 451 L750 451" fill="none" stroke="#17482E" stroke-width="3" marker-end="url(#arrow-forest)"/>
<text x="720" y="403" font-size="17" fill="#27784C" font-weight="600" text-anchor="middle">reassign</text>
<text x="64" y="709" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">RECEIPTS DESCRIBE THEIR OWN EXECUTIONS</text>
<path d="M64 744 L413 744 L437 768 L437 887 L64 887 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M413 744 L413 768 L437 768" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="87" y="786" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Earlier batch</text>
<text x="87" y="829" font-size="25" fill="#27784C" font-weight="400" text-anchor="start">trial version</text>
<text x="87" y="864" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">history stays unchanged</text>
<path d="M798 744 L1147 744 L1171 768 L1171 887 L798 887 Z" fill="#E8FFBB" stroke="#17482E" stroke-width="2"/>
<path d="M1147 744 L1147 768 L1171 768" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="821" y="786" font-size="26" fill="#17482E" font-weight="700" text-anchor="start">New batch after rollback</text>
<text x="821" y="829" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">restored prior version</text>
<text x="821" y="864" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">inspect its source-run receipt</text>
<rect x="64" y="924" width="1312" height="77" rx="4" fill="#FFFFFF" stroke="#17482E" stroke-width="1.5"/>
<text x="86" y="954" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1">ONE APPLICATION CHANGE EVENT</text>
<text x="86" y="985" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">old version   /   new version   /   source run   /   time   /   reason</text>
<text x="64" y="1034" font-size="19" fill="#17482E" font-weight="600" text-anchor="start">Helper event history is local and mutable. Alias reassignment and event persistence can fail separately.</text>
</g>
</svg>

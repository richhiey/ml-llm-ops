<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Trace the decision through to its replay.</title><desc id="desc">Three unclassified Harbor registered-version forms retain their source-run and validation-evidence links. A decision boundary combines the revised requirement with observed evidence without showing the selected target. The result must connect a retained alias event, a newly started batch and the selected recorded recipe. Main cumulative state remains separate.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1050" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">HARBOR / REGISTRY CHECKPOINT</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Trace the decision through to its replay.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Inspect the client versions, justify recovery, and prove what the next job actually uses.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">ISOLATED HARBOR STATE / NOT THE MAIN PROJECT</text>
<path d="M64 281 L355 281 L379 305 L379 407 L64 407 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M355 281 L355 305 L379 305" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="86" y="316" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Version ?</text>
<text x="86" y="354" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">source run + tags</text>
<path d="M86 382 L348 382" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<path d="M64 439 L355 439 L379 463 L379 565 L64 565 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M355 439 L355 463 L379 463" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="86" y="474" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Version ?</text>
<text x="86" y="512" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">source run + tags</text>
<path d="M86 540 L348 540" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<path d="M64 597 L355 597 L379 621 L379 723 L64 723 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M355 597 L355 621 L379 621" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="86" y="632" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Version ?</text>
<text x="86" y="670" font-size="22" fill="#27784C" font-weight="400" text-anchor="start">source run + tags</text>
<path d="M86 698 L348 698" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<path d="M429 319 L429 661" fill="none" stroke="#17482E" stroke-width="3"/>
<path d="M379 344 L429 344" fill="none" stroke="#17482E" stroke-width="2.5"/>
<path d="M379 502 L429 502" fill="none" stroke="#17482E" stroke-width="2.5"/>
<path d="M379 660 L429 660" fill="none" stroke="#17482E" stroke-width="2.5"/>
<path d="M429 502 L511 502" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="526" y="392" width="367" height="220" rx="5" fill="#E8FFBB" stroke="#17482E" stroke-width="2.5"/>
<text x="551" y="437" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Your recovery decision</text>
<text x="551" y="483" font-size="24" fill="#27784C" font-weight="400" text-anchor="start">approval evidence</text>
<text x="551" y="526" font-size="24" fill="#27784C" font-weight="400" text-anchor="start">+ revised RMSE limit</text>
<text x="551" y="569" font-size="24" fill="#27784C" font-weight="400" text-anchor="start">+ actual source metrics</text>
<path d="M893 502 L970 502" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M985 392 L1352 392 L1376 416 L1376 612 L985 612 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M1352 392 L1352 416 L1376 416" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="1008" y="436" font-size="27" fill="#17482E" font-weight="700" text-anchor="start">Selected version ?</text>
<text x="1008" y="486" font-size="23" fill="#27784C" font-weight="400" text-anchor="start">retained source run</text>
<text x="1008" y="529" font-size="23" fill="#27784C" font-weight="400" text-anchor="start">preserved alternatives</text>
<text x="1008" y="572" font-size="23" fill="#27784C" font-weight="400" text-anchor="start">reasoned alias change</text>
<text x="64" y="793" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">CONNECT ALL THREE PROOFS AFTER YOUR DECISION</text>
<circle cx="79" cy="842" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="847" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="849" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Change event</text>
<text x="64" y="892" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">old / new / reason / time</text>
<circle cx="535" cy="842" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="535" y="847" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">2</text>
<text x="560" y="849" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">New batch receipt</text>
<text x="520" y="892" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">resolved version + source run</text>
<circle cx="991" cy="842" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="991" y="847" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">3</text>
<text x="1016" y="849" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Recorded recipe replay</text>
<text x="976" y="892" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">matched lineage + RMSE delta</text>
<path d="M64 938 L1376 938" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="64" y="979" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">The picture names the evidence to connect. It does not choose a client version for you.</text>
<text x="64" y="1004" font-size="19" fill="#17482E" font-weight="600" text-anchor="start">Keep the main selection unchanged. Use explicit Harbor state and actual version/run IDs.</text>
</g>
</svg>

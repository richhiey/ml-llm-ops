<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">One paragraph can contain three claims.</title><desc id="desc">An explicitly authored teaching excerpt separates a lowest-validation-RMSE claim, a shared-controls claim and a cheapest-serving claim. Each routes to its own evidence: raw metric ranking, source/data/evaluation fields, and missing cost measurements. A numeric gate checks only the first kind of recommendation.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1030" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / CHECKING ASSISTANT ADVICE</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">One paragraph can contain three claims.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">A correct ranking does not verify the rest of the recommendation.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">AUTHORED TEACHING EXCERPT / NOT A LEARNER ASSISTANT RESPONSE</text>
<path d="M64 276 L1352 276 L1376 300 L1376 427 L64 427 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M1352 276 L1352 300 L1376 300" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="91" y="325" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">“Choose the lowest-error run under the same test conditions.</text>
<text x="91" y="372" font-size="29" fill="#17482E" font-weight="700" text-anchor="start">It will also be the cheapest model to serve.”</text>
<path d="M247 427 L247 511" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M720 427 L720 511" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<path d="M1190 427 L1190 511" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="79" cy="540" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="545" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="547" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Metric ranking</text>
<circle cx="555" cy="540" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="555" y="545" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">2</text>
<text x="580" y="547" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Comparable test</text>
<circle cx="1031" cy="540" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="1031" y="545" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">3</text>
<text x="1056" y="547" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Serving cost</text>
<text x="64" y="601" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">Run ID + raw</text>
<text x="64" y="637" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">validation rmse_kwh</text>
<path d="M64 665 L430 665" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="706" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">Check minimum; lower wins.</text>
<rect x="64" y="750" width="366" height="62" rx="4" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="247" y="789" font-size="24" fill="#17482E" font-weight="700" text-anchor="middle">Numeric gate</text>
<text x="540" y="601" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">Same source + snapshot</text>
<text x="540" y="637" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">guard + validation rows</text>
<path d="M540 665 L906 665" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="540" y="706" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">Inspect controls before ranking.</text>
<rect x="540" y="750" width="366" height="62" rx="4" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="723" y="789" font-size="24" fill="#17482E" font-weight="700" text-anchor="middle">Raw-record review</text>
<text x="1016" y="601" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">Error metrics contain</text>
<text x="1016" y="637" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">no serving-cost measurement.</text>
<path d="M1016 665 L1376 665" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="1016" y="706" font-size="19" fill="#B45309" font-weight="400" text-anchor="start">Retrieve another kind of evidence.</text>
<rect x="1016" y="750" width="360" height="62" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="1196" y="789" font-size="24" fill="#B45309" font-weight="700" text-anchor="middle">Unsupported here</text>
<text x="64" y="911" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">Keep the actual prompt, table and response. Correct only claims the evidence does not support.</text>
<text x="64" y="984" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">verify_summary checks the nominated numeric winner; it does not validate every sentence.</text>
</g>
</svg>

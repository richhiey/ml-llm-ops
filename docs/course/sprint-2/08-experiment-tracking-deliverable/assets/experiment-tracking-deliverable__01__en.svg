<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Can the recommendation survive inspection?</title><desc id="desc">An unclassified client observation document exposes only field names run_id, metric_name, evaluation_basis and value. Three retained evidence streams, the controlled runs, actual logging pair and real assistant response review, support a recommendation. No observation counts, duplicate grouping, candidate ranking or Harbor verdict is revealed.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1010" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">HARBOR / EXPERIMENT CHECKPOINT</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Can the recommendation survive inspection?</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Keep the client packet unchanged. Connect its claims to your existing evidence.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">UNCLASSIFIED CLIENT INTAKE</text>
<path d="M64 277 L405 277 L429 301 L429 603 L64 603 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M405 277 L405 301 L429 301" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="89" y="323" font-size="30" fill="#17482E" font-weight="700" text-anchor="start">Observations</text>
<path d="M91 367 L389 367" fill="none" stroke="#D0D0C4" stroke-width="3"/>
<path d="M91 407 L389 407" fill="none" stroke="#D0D0C4" stroke-width="3"/>
<path d="M91 447 L389 447" fill="none" stroke="#D0D0C4" stroke-width="3"/>
<path d="M91 487 L389 487" fill="none" stroke="#D0D0C4" stroke-width="3"/>
<text x="91" y="540" font-size="28" fill="#27784C" font-weight="400" text-anchor="start">…</text>
<text x="89" y="580" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">preserve original bytes</text>
<path d="M429 427 L536 427" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<text x="554" y="282" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">INSPECT EACH RECORDED FIELD</text>
<rect x="554" y="325" width="322" height="46" rx="3" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="577" y="356" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">run_id</text>
<path d="M908 355 L1015 355" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<rect x="554" y="389" width="322" height="46" rx="3" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="577" y="420" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">metric_name</text>
<path d="M908 419 L1015 419" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<rect x="554" y="453" width="322" height="46" rx="3" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="577" y="484" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">evaluation_basis</text>
<path d="M908 483 L1015 483" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<rect x="554" y="517" width="322" height="46" rx="3" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="577" y="548" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">value</text>
<path d="M908 547 L1015 547" fill="none" stroke="#D0D0C4" stroke-width="2"/>
<text x="1056" y="355" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">Which execution?</text>
<text x="1056" y="419" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">Which measurement?</text>
<text x="1056" y="483" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">Which rows?</text>
<text x="1056" y="547" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">What can it support?</text>
<path d="M64 650 L1376 650" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="695" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">REUSE THE THREE EVIDENCE STREAMS</text>
<circle cx="79" cy="744" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="749" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="751" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Controlled comparison</text>
<text x="64" y="797" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">five planned configurations</text>
<path d="M239 823 L239 865" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="535" cy="744" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="535" y="749" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">2</text>
<text x="560" y="751" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Logging setup</text>
<text x="520" y="797" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">actual manual / auto key sets</text>
<path d="M695 823 L695 865" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<circle cx="991" cy="744" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="991" y="749" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="middle">3</text>
<text x="1016" y="751" font-size="22" fill="#17482E" font-weight="700" text-anchor="start">Checked assistant advice</text>
<text x="976" y="797" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">actual response + claim review</text>
<path d="M1151 823 L1151 865" fill="none" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
<rect x="64" y="878" width="1312" height="57" rx="5" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="720" y="915" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">Your evidence-bounded recommendation</text>
<text x="64" y="964" font-size="19" fill="#17482E" font-weight="600" text-anchor="start">Do not let the number of observation labels stand in for an investigation of execution identity.</text>
</g>
</svg>

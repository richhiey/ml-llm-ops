<text x="90" y="805" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start">Both records retain the model-selection evidence.</text>
<text x="90" y="850" font-size="22" fill="#D7FF94" font-weight="400" text-anchor="start">Explicit validation metrics + source/data identity + one fitted model + recovery files</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Same predictions. Different recording work.</title><desc id="desc">Matching manual and autologged alpha1 executions share model/data/evaluation and validation RMSE. Automatic capture is enabled before fit and disabled afterward. Autolog adds actual ridge__alpha and training diagnostics; both retain explicit held-out metrics, lineage and one explicit fitted model.</desc>

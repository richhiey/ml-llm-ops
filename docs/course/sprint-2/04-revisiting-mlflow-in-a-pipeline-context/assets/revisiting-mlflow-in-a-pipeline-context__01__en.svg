<path d="M1352 530 L1352 554 L1376 554" fill="none" stroke="#17482E" stroke-width="2"/>
<text x="88" y="574" font-size="30" fill="#17482E" font-weight="700" text-anchor="start">Parameters</text>
<text x="88" y="626" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">alpha + guard</text>
<text x="88" y="668" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">data + source + partition</text>
<path d="M88 696 L419 696" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="88" y="733" font-size="17" fill="#27784C" font-weight="400" text-anchor="start">autolog adds:</text>
<text x="88" y="775" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">ridge__alpha + settings</text>
<text x="518" y="574" font-size="30" fill="#17482E" font-weight="700" text-anchor="start">Metrics</text>
<rect x="518" y="601" width="357" height="90" rx="0" fill="#E8FFBB" stroke="none" stroke-width="1.5"/>
<text x="535" y="633" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">rmse_kwh + mae_kwh</text>
<text x="535" y="668" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">explicit validation results</text>
<text x="518" y="733" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">autolog also records</text>
<text x="518" y="775" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">training diagnostics</text>
<text x="972" y="574" font-size="30" fill="#17482E" font-weight="700" text-anchor="start">Artifacts</text>
<text x="972" y="626" font-size="24" fill="#17482E" font-weight="600" text-anchor="start">fitted model</text>
<text x="972" y="668" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">reproduction/</text>
<text x="972" y="715" font-size="20" fill="#27784C" font-weight="400" text-anchor="start">manifest + config</text>
<text x="972" y="754" font-size="19" fill="#27784C" font-weight="400" text-anchor="start">source archive + environment</text>
<text x="64" y="909" font-size="23" fill="#17482E" font-weight="600" text-anchor="start">The hook notices fitting. The wrapper still names the acceptance metric and saves the recipe.</text>
<text x="64" y="994" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">Reopen the same run ID in MLflow. This is an execution diagram, not an interface capture.</text>
</g>

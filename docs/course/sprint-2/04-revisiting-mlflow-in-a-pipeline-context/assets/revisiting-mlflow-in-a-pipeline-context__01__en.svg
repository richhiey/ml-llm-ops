<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Record the work while it happens.</title><desc id="desc">Inside one Workspace.run execution, the sklearn hook is enabled before fit; fitting emits estimator settings and training diagnostics. Explicit held-out evaluation logs rmse_kwh and mae_kwh, while explicit model/recovery writes retain artifacts. All records share one run identifier; the hook is reset afterward.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B45309"/></marker>
</defs>
<rect width="1440" height="1040" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">LINDEN / PIPELINE-INTEGRATED TRACKING</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">Record the work while it happens.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">One run connects the fitted pipeline to its settings, measured results and recovery files.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="64" y="238" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">ONE TRACKED EXECUTION</text>
<rect x="64" y="275" width="1312" height="154" rx="6" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="91" y="314" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="start">1</text>
<text x="91" y="354" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">Open run</text>
<text x="91" y="391" font-size="17" fill="#D7FF94" font-weight="400" text-anchor="start">unique ID</text>
<text x="410" y="314" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="start">2</text>
<text x="410" y="354" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">Fit pipeline</text>
<text x="410" y="391" font-size="17" fill="#D7FF94" font-weight="400" text-anchor="start">hook already enabled</text>
<text x="760" y="314" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="start">3</text>
<text x="760" y="354" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">Evaluate</text>
<text x="760" y="391" font-size="17" fill="#D7FF94" font-weight="400" text-anchor="start">held-out validation</text>
<text x="1100" y="314" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="start">4</text>
<text x="1100" y="354" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">Retain files</text>
<text x="1100" y="391" font-size="17" fill="#D7FF94" font-weight="400" text-anchor="start">then close run</text>

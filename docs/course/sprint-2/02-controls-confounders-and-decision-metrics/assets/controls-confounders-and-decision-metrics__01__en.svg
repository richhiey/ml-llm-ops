<text x="64" y="981" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Before averaging: an 8 kWh miss contributes 64 kWh²; a 4 kWh miss contributes 16 kWh².</text>
<text x="64" y="1014" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">RMSE selects Linden’s comparable runs. MAE explains average miss size; neither measures serving cost.</text>

<text x="88" y="510" font-size="22" fill="#B45309" font-weight="600" text-anchor="start">source run?</text>
<path d="M400 319 L465 319" fill="none" stroke="#D0D0C4" stroke-width="2.5" stroke-dasharray="5 5"/>
<path d="M475 311 L491 327" fill="none" stroke="#B45309" stroke-width="3"/>
<path d="M475 327 L491 311" fill="none" stroke="#B45309" stroke-width="3"/>

<text x="844" y="313" font-size="18" fill="#D7FF94" font-weight="600" text-anchor="start">Unique run ID</text>
<text x="844" y="346" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="start">one execution, connected evidence</text>
<path d="M1097 364 L790 364 L790 620" fill="none" stroke="#17482E" stroke-width="2.5"/>
<rect x="817" y="402" width="559" height="72" rx="4" fill="#FFFFFF" stroke="#17482E" stroke-width="1.5"/>
<text x="840" y="427" font-size="13" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1">PARAMETERS</text>
<text x="840" y="457" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">alpha + source + data + partition</text>
<path d="M790 438 L805 438" fill="none" stroke="#17482E" stroke-width="2" marker-end="url(#arrow-forest)"/>
<rect x="817" y="493" width="559" height="72" rx="4" fill="#FFFFFF" stroke="#17482E" stroke-width="1.5"/>

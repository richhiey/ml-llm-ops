<text x="536" y="543" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">best.pkl</text>
<path d="M760 237 L760 596" fill="none" stroke="#D0D0C4" stroke-width="1"/>
<text x="817" y="237" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.2">RECORDED AT EXECUTION TIME</text>

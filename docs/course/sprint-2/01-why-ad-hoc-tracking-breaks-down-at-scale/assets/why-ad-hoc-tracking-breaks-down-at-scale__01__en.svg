<text x="515" y="364" font-size="18" fill="#B45309" font-weight="400" text-anchor="start">No retained recipe</text>
<text x="515" y="433" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">Which test?</text>
<text x="515" y="471" font-size="18" fill="#B45309" font-weight="400" text-anchor="start">No recorded row basis</text>

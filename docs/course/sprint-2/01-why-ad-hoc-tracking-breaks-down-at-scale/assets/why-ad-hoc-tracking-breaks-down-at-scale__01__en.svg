<rect x="817" y="584" width="559" height="72" rx="4" fill="#E8FFBB" stroke="#17482E" stroke-width="1.5"/>
<text x="840" y="609" font-size="13" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1">ARTIFACTS</text>
<text x="840" y="639" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">fitted model + recovery files</text>
<path d="M790 620 L805 620" fill="none" stroke="#17482E" stroke-width="2" marker-end="url(#arrow-forest)"/>
<rect x="64" y="718" width="1312" height="126" rx="6" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="91" y="758" font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="start">More rows do not restore missing history.</text>
<text x="91" y="803" font-size="21" fill="#D7FF94" font-weight="400" text-anchor="start">Record the relationships while the pipeline runs; inspect them when making a recommendation.</text>
<text x="64" y="914" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">Illustrative copied score. Tracking preserves recorded context; it cannot recreate omitted facts.</text>

<text x="482" y="354" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">load</text>
<text x="724" y="354" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">predict + write</text>
<path d="M881 344 L1012 344" fill="none" stroke="#17482E" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow-forest)"/>

<rect x="483" y="495" width="390" height="32" rx="0" fill="#ECEBE4" stroke="none" stroke-width="1.5"/>
<text x="678" y="518" font-size="21" fill="#27784C" font-weight="600" text-anchor="middle">one timed delivery</text>
<text x="64" y="570" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.5">REQUESTS / ONE COMPLETION PER CALLER</text>
<rect x="64" y="602" width="1312" height="255" rx="6" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="90" y="642" font-size="15" fill="#D7FF94" font-weight="700" text-anchor="start" letter-spacing="1.5">SERVICE AVAILABLE THROUGHOUT</text>

<text x="142" y="351" font-size="16" fill="#27784C" font-weight="400" text-anchor="start">train</text>
<text x="84" y="400" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">48</text>
<text x="142" y="399" font-size="16" fill="#27784C" font-weight="400" text-anchor="start">validation</text>
<text x="84" y="448" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">24</text>
<text x="142" y="447" font-size="16" fill="#27784C" font-weight="400" text-anchor="start">reserved final</text>

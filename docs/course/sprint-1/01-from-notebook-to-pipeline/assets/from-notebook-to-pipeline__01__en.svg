<text x="64" y="235" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.5">HISTORICAL / KNOWN DEMAND</text>
<circle cx="79" cy="275" r="15" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="79" y="281" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="middle">1</text>
<text x="105" y="283" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">Ingestion</text>

<text x="1112" y="399" font-size="22" fill="#17482E" font-weight="400" text-anchor="start">vs known demand</text>
<path d="M1112 419 L1365 419" fill="none" stroke="#D0D0C4" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="1112" y="457" font-size="25" fill="#17482E" font-weight="700" text-anchor="start">RMSE / MAE</text>
<text x="1112" y="487" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">kWh</text>

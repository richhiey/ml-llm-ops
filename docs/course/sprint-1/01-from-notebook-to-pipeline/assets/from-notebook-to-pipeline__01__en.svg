<text x="689" y="281" font-size="16" fill="#D7FF94" font-weight="700" text-anchor="middle">3</text>
<text x="715" y="283" font-size="23" fill="#17482E" font-weight="700" text-anchor="start">Training</text>
<rect x="674" y="310" width="320" height="144" rx="8" fill="#17482E" stroke="none" stroke-width="1.5"/>
<text x="834.0" y="343" font-size="14" fill="#D7FF94" font-weight="700" text-anchor="middle" letter-spacing="1.5">FITTED TOGETHER</text>

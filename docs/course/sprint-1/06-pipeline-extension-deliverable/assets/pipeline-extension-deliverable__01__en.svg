<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">A claim needs a trail of evidence.</title><desc id="desc">Five unclassified Harbor identifiers enter the existing validation boundary. Conditional outcomes show the contract, not the answers: all valid inputs return unchanged in an independent table; any violation raises an error without a repaired result. Below, a shared evidence spine joins validated change, explanation and justified delivery. The 24-row planned batch is separate from the five-row intake.</desc>
<defs>
<marker id="arrow-forest" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17482E"/></marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#27784C"/></marker>
<marker id="arrow-white" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#FFFFFF"/></marker>
<marker id="arrow-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#B91C1C"/></marker>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D0D0C4"/></marker>
</defs>
<rect width="1440" height="960" fill="#ECEBE4"/>
<g font-family="sans-serif">
<text x="64" y="49" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="2">HARBOR / ACCEPTANCE CHECKPOINT</text>
<text x="64" y="112" font-size="42" fill="#0A0A0A" font-weight="700" text-anchor="start">A claim needs a trail of evidence.</text>
<text x="64" y="152" font-size="21" fill="#27784C" font-weight="400" text-anchor="start">Decide the unfamiliar intake. Support all three parts of the handoff.</text>
<path d="M64 186 L1376 186" fill="none" stroke="#D0D0C4" stroke-width="1" stroke-linejoin="miter"/>
<text x="64" y="239" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.5">UNFAMILIAR INTAKE</text>
<path d="M64 266 L281 266 L307 292 L307 518 L64 518 Z" fill="#FFFFFF" stroke="#17482E" stroke-width="2"/>
<path d="M281 266 L281 292 L307 292" fill="none" stroke="#17482E" stroke-width="2" stroke-linejoin="miter"/>
<text x="86" y="310" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">H-201</text>
<path d="M174 304 L275 304" fill="none" stroke="#D0D0C4" stroke-width="3" stroke-linejoin="miter"/>
<text x="86" y="350" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">H-202</text>
<path d="M174 344 L275 344" fill="none" stroke="#D0D0C4" stroke-width="3" stroke-linejoin="miter"/>
<text x="86" y="390" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">H-203</text>
<path d="M174 384 L275 384" fill="none" stroke="#D0D0C4" stroke-width="3" stroke-linejoin="miter"/>
<text x="86" y="430" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">H-204</text>
<path d="M174 424 L275 424" fill="none" stroke="#D0D0C4" stroke-width="3" stroke-linejoin="miter"/>
<text x="86" y="470" font-size="20" fill="#17482E" font-weight="600" text-anchor="start">H-205</text>
<path d="M174 464 L275 464" fill="none" stroke="#D0D0C4" stroke-width="3" stroke-linejoin="miter"/>
<path d="M307 390 L414 390" fill="none" stroke="#17482E" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow-forest)"/>
<rect x="428" y="285" width="14" height="216" rx="0" fill="#17482E" stroke="none" stroke-width="1.5"/>
<rect x="442" y="335" width="316" height="112" rx="0" fill="#E8FFBB" stroke="#17482E" stroke-width="2.5"/>
<text x="600" y="380" font-size="25" fill="#17482E" font-weight="700" text-anchor="middle">Your existing guard</text>
<text x="600" y="414" font-size="18" fill="#27784C" font-weight="400" text-anchor="middle">one call, declared rules</text>
<path d="M758 370 L843 370 L843 310 L914 310" fill="none" stroke="#17482E" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow-forest)"/>
<text x="940" y="289" font-size="14" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1">IF ALL ROWS ARE VALID</text>
<text x="940" y="327" font-size="24" fill="#17482E" font-weight="700" text-anchor="start">Unchanged, independent table</text>
<path d="M758 413 L843 413 L843 472 L914 472" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow-red)"/>
<text x="940" y="450" font-size="14" fill="#B91C1C" font-weight="700" text-anchor="start" letter-spacing="1">IF ANY ROW VIOLATES A RULE</text>
<text x="940" y="488" font-size="24" fill="#B91C1C" font-weight="700" text-anchor="start">ValueError; no repaired result</text>
<text x="64" y="565" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">Predict each row and the whole call before running them.</text>
<text x="64" y="647" font-size="15" fill="#27784C" font-weight="700" text-anchor="start" letter-spacing="1.5">THE HANDOFF NEEDS ALL THREE</text>
<path d="M64 691 L1376 691" fill="none" stroke="#17482E" stroke-width="2" stroke-linejoin="miter"/>
<circle cx="81" cy="691" r="17" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="81" y="697" font-size="14" fill="#D7FF94" font-weight="700" text-anchor="middle">01</text>
<text x="64" y="748" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Validated change</text>
<circle cx="533" cy="691" r="17" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="533" y="697" font-size="14" fill="#D7FF94" font-weight="700" text-anchor="middle">02</text>
<text x="516" y="748" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Explanation</text>
<circle cx="985" cy="691" r="17" fill="#17482E" stroke="none" stroke-width="2"/>
<text x="985" y="697" font-size="14" fill="#D7FF94" font-weight="700" text-anchor="middle">03</text>
<text x="968" y="748" font-size="28" fill="#17482E" font-weight="700" text-anchor="start">Delivery decision</text>
<text x="64" y="796" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">new module</text>
<text x="241" y="796" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">+ call</text>
<text x="64" y="834" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">diff + before/after + supplier probes</text>
<text x="516" y="796" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">statement</text>
<path d="M644 788 L704 788" fill="none" stroke="#17482E" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow-forest)"/>
<text x="721" y="796" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">effect</text>
<text x="516" y="834" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">line effects + distinguishing inputs</text>
<text x="968" y="796" font-size="22" fill="#17482E" font-weight="600" text-anchor="start">24 planned rows / ≤ 60 s</text>
<text x="968" y="834" font-size="18" fill="#27784C" font-weight="400" text-anchor="start">brief + measured batch + reasoning</text>
<text x="64" y="914" font-size="21" fill="#17482E" font-weight="600" text-anchor="start">The five-row supplier intake and the 24-row planned delivery answer different questions.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">One record. Three different responsibilities.</title><desc id="desc">Actual bundled record D003 contains temperature 16.65 degrees Celsius, hour 3 and occupancy 67 percent. Preprocess selects those three ordered features. Demand 69.456248 kWh is a separate training target; row ID and partition are metadata. Planned B00 supplies 12, 0 and 20 with no target. Its ID reaches the delivered prediction row.</desc>
